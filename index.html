<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Scripts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
        }

        header {
            text-align: center;
            padding: 60px 20px 35px;
        }

        header h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        header p {
            color: #aaa;
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: auto;
        }

        .script {
            background: #171722;
            border: 1px solid #29293a;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .script h2 {
            margin-top: 0;
        }

        .script p {
            color: #aaa;
        }

        .botao {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 10px;
            background: #7c3cff;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .botao:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <header>
        <h1>🔥 MEUS SCRIPTS</h1>
        <p>Escolha o script que você deseja.</p>
    </header>

    <main class="container">

        <div class="script">
            <h2>Script 1</h2>
            <p>Descrição do primeiro script.</p>

            <a class="botao" href="#">
                PEGAR SCRIPT
            </a>
        </div>

        <div class="script">
            <h2>Script 2</h2>
            <p>Descrição do segundo script.</p>

            <a class="botao" href="#">
                PEGAR SCRIPT
            </a>
        </div>

        <div class="script">
            <h2>Script 3</h2>
            <p>Descrição do terceiro script.</p>

            <a class="botao" href="#">
                PEGAR SCRIPT
            </a>
        </div>

    </main>

</body>
</html>
