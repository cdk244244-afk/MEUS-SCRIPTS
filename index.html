<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Scripts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .script-box {
            background: #1c1c1c;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }

        .script-box h2 {
            margin-top: 0;
        }

        pre {
            background: #080808;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #ddd;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #mensagem {
            text-align: center;
            margin-top: 12px;
            color: #7cff7c;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>MEUS SCRIPTS</h1>

        <p class="subtitle">
            Script disponível abaixo
        </p>

        <div class="script-box">

            <h2>Meu Script</h2>

            <pre id="codigo">loadstring(game:HttpGet("https://raw.githubusercontent.com/tienkhanh1/spicy/main/Chilli.lua"))()</pre>

            <button onclick="copiarScript()">
                COPIAR SCRIPT
            </button>

            <p id="mensagem">Script copiado! ✅</p>

        </div>

    </div>

    <script>
        function copiarScript() {
            const codigo = document.getElementById("codigo").innerText;

            navigator.clipboard.writeText(codigo).then(function() {
                const mensagem = document.getElementById("mensagem");

                mensagem.style.display = "block";

                setTimeout(function() {
                    mensagem.style.display = "none";
                }, 2000);
            });
        }
    </script>

</body>
</html>
